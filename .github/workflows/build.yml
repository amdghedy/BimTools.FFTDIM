name: Build and smoke test

on:
  push:
    branches: ["main", "feat/**", "docs/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/BimTools.FFTDIM/BimTools.FFTDIM.csproj --configuration Release
      - name: Run sample audit
        run: |
          mkdir -p artifacts
          set +e
          dotnet run --no-build --configuration Release --project src/BimTools.FFTDIM -- audit samples/sample-model.json --rules samples/audit-rules.json --out artifacts/report.json --csv artifacts/report.csv
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          test -s artifacts/report.json
          test -s artifacts/report.csv
          grep -q '"totalElements": 5' artifacts/report.json
          grep -q 'FTD003' artifacts/report.csv
